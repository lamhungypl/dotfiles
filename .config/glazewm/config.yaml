# GlazeWM config — ported from .config/aerospace/aerospace.toml
# Install: copy to %USERPROFILE%\.glzr\glazewm\config.yaml (then alt+shift+r to reload)
# Docs: https://github.com/glzr-io/glazewm

general:
  # Zebar status bar (shows workspaces). Requires Zebar installed.
  startup_commands: ['shell-exec zebar']
  shutdown_commands: ['shell-exec taskkill /IM zebar.exe /F']
  config_reload_commands: []

  focus_follows_cursor: false
  toggle_workspace_on_refocus: false

  # aerospace: on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
  cursor_jump:
    enabled: true
    trigger: 'monitor_focus'

  hide_method: 'cloak'
  show_all_in_taskbar: true

# aerospace: inner 6 / outer 4 (top = Zebar bar height + 4px)
gaps:
  scale_with_dpi: true
  inner_gap: '6px'
  outer_gap:
    top: '44px'
    right: '4px'
    bottom: '4px'
    left: '4px'

window_effects:
  focused_window:
    border:
      enabled: true
      color: '#8dbcff'
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: false
      style: 'square'
    transparency:
      enabled: false
      opacity: '95%'
  other_windows:
    border:
      enabled: false
      color: '#a1a1a1'
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: false
      style: 'square'
    transparency:
      enabled: false
      opacity: '0%'

window_behavior:
  initial_state: 'tiling'
  state_defaults:
    floating:
      centered: true
      shown_on_top: false
    fullscreen:
      maximized: false
      shown_on_top: false

# Same workspace names as aerospace (1-9, A-E).
# To pin a workspace to a monitor (aerospace workspace-to-monitor-force-assignment),
# add `bind_to_monitor: <index>` (0-based, order as Windows reports them), e.g.:
#   - name: '6'
#     bind_to_monitor: 1
workspaces:
  - name: '1'
  - name: '2'
  - name: '3'
  - name: '4'
  - name: '5'
  - name: '6'
  - name: '7'
  - name: '8'
  - name: '9'
  - name: 'A'
  - name: 'B'
  - name: 'C'
  - name: 'D'
  - name: 'E'

window_rules:
  # --- App → workspace (aerospace on-window-detected) ---
  - commands: ['move --workspace 1']
    match:
      - window_process: { equals: 'Code' }

  - commands: ['move --workspace 2']
    match:
      - window_process: { equals: 'wezterm-gui' }

  - commands: ['move --workspace 3']
    match:
      - window_process: { equals: 'chrome' }

  - commands: ['move --workspace 5']
    match:
      - window_process: { equals: 'slack' }

  # Finder → File Explorer windows only (not the taskbar/desktop)
  - commands: ['move --workspace 6']
    match:
      - window_process: { equals: 'explorer' }
        window_class: { equals: 'CabinetWClass' }

  - commands: ['move --workspace 7']
    match:
      - window_process: { equals: 'Postman' }

  - commands: ['move --workspace 9']
    match:
      - window_process: { equals: 'Docker Desktop' }

  - commands: ['move --workspace A']
    match:
      - window_process: { equals: 'Zalo' }
      - window_process: { equals: 'zed' }

  - commands: ['move --workspace D']
    match:
      - window_process: { regex: '(?i)pencil' }

  # --- Ignore rules (from GlazeWM defaults) ---
  - commands: ['ignore']
    match:
      - window_process: { equals: 'zebar' }
      - window_title: { regex: '[Pp]icture.in.[Pp]icture' }
        window_class: { regex: 'Chrome_WidgetWin_1|MozillaDialogClass' }
      - window_process: { equals: 'PowerToys' }
        window_class: { regex: 'HwndWrapper\[PowerToys\.PowerAccent.*?\]' }
      - window_title: { equals: 'Command Palette' }
        window_class: { equals: 'WinUIDesktopWin32WindowClass' }
      - window_process: { equals: 'PowerToys' }
        window_title: { regex: '.*? - Peek' }
      - window_process: { equals: 'EXCEL' }
        window_class: { not_regex: 'XLMAIN' }
      - window_process: { equals: 'WINWORD' }
        window_class: { not_regex: 'OpusApp' }
      - window_process: { equals: 'POWERPNT' }
        window_class: { not_regex: 'PPTFrameClass' }

binding_modes:
  # aerospace 'service' mode (alt+shift+; to enter)
  - name: 'service'
    keybindings:
      - commands: ['wm-reload-config', 'wm-disable-binding-mode --name service']
        bindings: ['escape']
      # aerospace: flatten-workspace-tree (closest equivalent: redraw)
      - commands: ['wm-redraw', 'wm-disable-binding-mode --name service']
        bindings: ['r']
      # toggle floating / tiling
      - commands: ['toggle-floating --centered', 'wm-disable-binding-mode --name service']
        bindings: ['f']
      # Not available in GlazeWM: close-all-windows-but-current, join-with, volume

keybindings:
  # Focus (alt+hjkl)
  - commands: ['focus --direction left']
    bindings: ['alt+h']
  - commands: ['focus --direction down']
    bindings: ['alt+j']
  - commands: ['focus --direction up']
    bindings: ['alt+k']
  - commands: ['focus --direction right']
    bindings: ['alt+l']

  # Move (alt+shift+hjkl)
  - commands: ['move --direction left']
    bindings: ['alt+shift+h']
  - commands: ['move --direction down']
    bindings: ['alt+shift+j']
  - commands: ['move --direction up']
    bindings: ['alt+shift+k']
  - commands: ['move --direction right']
    bindings: ['alt+shift+l']

  # aerospace: layout tiles horizontal vertical
  - commands: ['toggle-tiling-direction']
    bindings: ['alt+oem_question']

  # aerospace: resize smart -50 / +50
  - commands: ['resize --width -50px']
    bindings: ['alt+oem_minus']
  - commands: ['resize --width +50px']
    bindings: ['alt+oem_plus']

  # aerospace: fullscreen
  - commands: ['toggle-fullscreen']
    bindings: ['alt+shift+f']

  # aerospace: workspace-back-and-forth
  # NOTE: overrides Windows alt+tab. Change to e.g. 'alt+oem_tilde' (backtick) if you want native alt+tab back.
  - commands: ['focus --recent-workspace']
    bindings: ['alt+tab']

  # aerospace: move-workspace-to-monitor --wrap-around next
  - commands: ['move-workspace --direction right']
    bindings: ['alt+shift+tab']

  # aerospace: mode service
  - commands: ['wm-enable-binding-mode --name service']
    bindings: ['alt+shift+oem_semicolon']

  # GlazeWM extras (no aerospace equivalent)
  - commands: ['wm-reload-config']
    bindings: ['alt+shift+r']
  - commands: ['wm-toggle-pause']
    bindings: ['alt+shift+p']

  # Workspaces
  - commands: ['focus --workspace 1']
    bindings: ['alt+1']
  - commands: ['focus --workspace 2']
    bindings: ['alt+2']
  - commands: ['focus --workspace 3']
    bindings: ['alt+3']
  - commands: ['focus --workspace 4']
    bindings: ['alt+4']
  - commands: ['focus --workspace 5']
    bindings: ['alt+5']
  - commands: ['focus --workspace 6']
    bindings: ['alt+6']
  - commands: ['focus --workspace 7']
    bindings: ['alt+7']
  - commands: ['focus --workspace 8']
    bindings: ['alt+8']
  - commands: ['focus --workspace 9']
    bindings: ['alt+9']
  - commands: ['focus --workspace A']
    bindings: ['alt+a']
  - commands: ['focus --workspace B']
    bindings: ['alt+b']
  - commands: ['focus --workspace C']
    bindings: ['alt+c']
  - commands: ['focus --workspace D']
    bindings: ['alt+d']
  - commands: ['focus --workspace E']
    bindings: ['alt+e']

  # Move window to workspace (aerospace move-node-to-workspace: focus stays put)
  - commands: ['move --workspace 1']
    bindings: ['alt+shift+1']
  - commands: ['move --workspace 2']
    bindings: ['alt+shift+2']
  - commands: ['move --workspace 3']
    bindings: ['alt+shift+3']
  - commands: ['move --workspace 4']
    bindings: ['alt+shift+4']
  - commands: ['move --workspace 5']
    bindings: ['alt+shift+5']
  - commands: ['move --workspace 6']
    bindings: ['alt+shift+6']
  - commands: ['move --workspace 7']
    bindings: ['alt+shift+7']
  - commands: ['move --workspace 8']
    bindings: ['alt+shift+8']
  - commands: ['move --workspace 9']
    bindings: ['alt+shift+9']
  - commands: ['move --workspace A']
    bindings: ['alt+shift+a']
  - commands: ['move --workspace B']
    bindings: ['alt+shift+b']
  - commands: ['move --workspace C']
    bindings: ['alt+shift+c']
  - commands: ['move --workspace D']
    bindings: ['alt+shift+d']
  - commands: ['move --workspace E']
    bindings: ['alt+shift+e']
